; bug_fix settings. Each fix has a [<fix name>] section; enabled=1 installs it, 0 leaves the game unchanged.
; Without this file or a key, every fix is installed. Details of each fix are in docs/fixes/.

[follow_detach]
; Crash at the true-route ending after resuming from the photographer in the jail (jail_ending_crash.md)
enabled=1

[property_return]
; Confiscated weapons, items and outfit not given back after Madara's rescue (madara_rescue_property.md)
enabled=1

[translucent_depth]
; White or black boxes around effects such as bloom (effect_box.md)
enabled=1

[physical_screen_check]
; Display mode changed every time you return to the full screen window on a scaled monitor (focus_white_screen.md)
enabled=1

[skip_full_screen_reapply]
; Window resized past the screen, white screen and device reset every time you return to it (focus_white_screen.md)
enabled=1

[no_white_background]
; White window background shown whenever the window is repainted before the next frame (focus_white_screen.md)
enabled=1
