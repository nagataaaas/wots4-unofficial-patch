; unofficial_patch settings. Each fix has a [<fix name>] section; enabled=1 installs it, 0 leaves the game unchanged.
; Without this file or a key, every fix is installed. Details of each fix are in docs/fixes/.

[follow_detach]
; Crash at the true-route ending after resuming from the photographer in the jail (jail_ending_crash.md)
enabled=1

[property_return]
; Confiscated weapons, items and outfit not given back after Madara's rescue (madara_rescue_property.md)
enabled=1

[translucent_depth]
; White or black boxes around effects such as bloom (effect_box.md)
enabled=1

[physical_screen_check]
; Display mode changed every time you return to the full screen window on a scaled monitor (focus_white_screen.md)
enabled=1

[skip_full_screen_reapply]
; Window resized past the screen, white screen and device reset every time you return to it (focus_white_screen.md)
enabled=1

[no_white_background]
; White window background shown whenever the window is repainted before the next frame (focus_white_screen.md)
enabled=1

[yobai_result_reset]
; Night visit reward handed out again and promise lost after returning to the title and loading (yobai_result_after_title.md)
enabled=1

[listener_orientation]
; Voices and sound effects near the player nearly silent on stereo output without Windows Sonic (listener_orientation.md)
enabled=1

[stereo_3d_sound]
; More than 65 sound effects (fishing splashes, doors, explosions, torture devices...) never playing, and voices going silent after fishing (stereo_3d_sound.md)
enabled=1

[fullwidth_digits]
; Fullwidth digits shown as solid key-shaped boxes in text; numeric key prompts are preserved (fullwidth_digits.md)
enabled=1

[sound_slot_release]
; Streamed voices and sound effects going silent until a restart, and stopped loops such as torture sounds replayed when a menu closes (sound_slot_leak.md)
enabled=1

[text_input_keyboard]
; E (Back) and Space (OK) closing the sect name and weapon name input while typing with the IME (text_input.md)
enabled=1

[text_input_characters]
; Japanese characters dropped at random from the sect name and weapon names (text_input.md)
enabled=1

[player_name_characters]
; Characters from U+8000 up, such as many kanji and fullwidth letters, dropped from the player's name (text_input.md)
enabled=1

[title_select_window]
; Crash at New Game, or at the difficulty selection after Load, once Options was opened on the title (title_select_window.md)
enabled=1

[render_target_recovery]
; Crash when switching to another window, when the game cannot draw to the screen after its device is reset (focus_change_crash.md)
enabled=1

[display_mode_list]
; Game freezing for minutes when starting to play or the first time Options is opened, on a monitor with many display modes (display_mode_list.md)
enabled=1

[empty_corpse_loot]
; Empty corpses remaining searchable or eligible for repeated kick draws after their loot is exhausted (empty_corpse_loot.md)
enabled=1
