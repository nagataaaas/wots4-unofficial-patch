name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # Version of the ModLoader (Mod SDK) to build against. A wots4-mods tag or commit
  WOTS4_SDK_REF: d2c4849c3ba7f71a7d05dc65c0f30fb10de7facd

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod

      # While wots4-mods is private, a PAT that can read it (WOTS4_SDK_TOKEN) is required
      - uses: actions/checkout@v4
        with:
          repository: nagataaaas/wots4-mods
          ref: ${{ env.WOTS4_SDK_REF }}
          path: sdk
          token: ${{ secrets.WOTS4_SDK_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages for the tests
        run: python -m pip install cryptography

      - name: build and test
        run: |
          cmake -S mod -B build -A Win32 -DWOTS4_SDK_DIR="${{ github.workspace }}/sdk"
          cmake --build build --config Release
          ctest --test-dir build -C Release -LE needs_exe --output-on-failure --timeout 300
